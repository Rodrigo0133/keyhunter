services:
  keyhunter:
    build: .
    container_name: keyhunter
    init: true
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./results:/app/results
    working_dir: /app
    deploy:
      resources:
        limits:
          memory: 2G
     # Override command as needed:
    # command: ["scan", "-p", "openai"]
    command: ["scan", "-p", "anthropic", "-v"]
    # command: ["patterns"]

  bot-alertas:
    build:
      context: ./discord-notifier
      dockerfile: dockerfile
    container_name: bot-alertas
    restart: unless-stopped
    init: true
    env_file:
      - ./discord-notifier/.env
    ports:
      - "3000:3000"
    volumes:
      - ./results:/app/results:ro    # se o bot lê os resultados
    depends_on:
      - keyhunter 