version: '3.8'

services:
  keyhunter:
    build: .
    container_name: keyhunter
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./results:/app/results
    working_dir: /app
    # Override command as needed:
    # command: ["scan", "-p", "openai"]
    # command: ["scan", "-p", "openai", "-v"]
    # command: ["patterns"]

  bot-alertas:
    build:
      context: ./discord-notifier
      dockerfile: dockerfile
    container_name: bot-alertas
    restart: unless-stopped
    env_file:
      - ./discord-notifier/.env
    ports:
      - "3000:3000"
    init: true